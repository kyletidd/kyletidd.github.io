<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title></title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111}
html{scroll-behavior:smooth}
button{font:inherit}
#wall{max-width:1580px;margin:0 auto;padding:clamp(62px,10vw,172px) clamp(22px,7vw,120px) 15vh}
.group{display:flex;align-items:flex-start;justify-content:space-between;gap:clamp(24px,7vw,140px);margin-bottom:clamp(105px,15vw,275px);min-height:130px}
.group:nth-child(3n+2){padding-left:clamp(0px,8vw,150px)}
.group:nth-child(4n+3){padding-right:clamp(0px,9vw,160px)}
.group:nth-child(5n){justify-content:center}
.print{appearance:none;display:block;position:relative;flex:0 1 var(--width);max-width:var(--width);margin-top:var(--down);padding:0;border:0;background:transparent;cursor:zoom-in;transform:none;transition:none}
.print img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;box-shadow:none!important;background:transparent}

.print:hover,.print:focus-visible{outline:none;z-index:2}
.print:focus img,.print:focus-visible img{outline:none!important;border:0!important;box-shadow:none!important}
.print.small{align-self:flex-end}
.print.small img{max-height:38vh}
.print.large img{max-height:85vh}
#sentinel{height:1px}
#viewer{position:fixed;inset:0;display:none;background:#fff;z-index:20;align-items:center;justify-content:center;padding:6vw;cursor:zoom-out}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:88dvh;object-fit:contain;box-shadow:none}
#viewer button{position:absolute;top:0;bottom:0;width:18%;background:transparent;border:0;cursor:pointer}
#previous{left:0;cursor:w-resize!important}
#next{right:0;cursor:e-resize!important}
#viewer button:focus-visible{outline:2px solid #111;outline-offset:-8px}
@media(max-width:700px){
 #wall{padding:75px 18px 60px}
 .group{gap:22px;margin-bottom:110px;min-height:0}
 .group:nth-child(n){padding-left:0;padding-right:0}
 .group:nth-child(4n+2){padding-left:12vw}
 .group:nth-child(5n+3){padding-right:9vw}
 .print{margin-top:calc(var(--down) * .35)}
 .print img{max-height:64vh}
 .print.small img{max-height:32vh}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.print{transition:none}}
</style>
</head>
<body>
<main id="wall" aria-label="Photographs and working images"></main>
<div id="sentinel" aria-hidden="true"></div>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer" tabindex="-1">
<button id="previous" aria-label="Previous image"></button>
<img id="large-image" alt="">
<button id="next" aria-label="Next image"></button>
</div>
<script>
const images = [
    '20241203091002_001_C.jpg',
    '20241203083125_001_C.jpg',
    '20241118144232_001_C.jpg',
    '20241203091812_001_C.jpg',
    '20241203091914_001_C.jpg',
    '20241203091724_001_C.jpg',
    '20241203091219_001_C.jpg',
    '20241203091132_001_C.jpg',
    '20241203091047_001_C.jpg',
    '20241203090918_001-2.jpg',
    '20241203090833_001-2.jpg',
    '20241203090655_001.jpg',
    '20241203090746_001.jpg',
    '20241203083940_001.jpg',
    '20241203084033_001.jpg',
    '20241118143953_001.jpg',
    '20241118144339_001.jpg',
    '20241203085715_001.jpg',
    '20241203085644_001.jpg',
    '20241203083748_001.jpg',
    '20241203083431_001.jpg',
    '20241203083334_001.jpg',
    '20241203083845_001.jpg',
    '20241203085134_001.jpg',
    '20241203090128_001.jpg',
    '000065400006 C.jpg',
    '000065400007 C.jpg',
    '000065400013 C.jpg',
    'IMG_0778.JPG',
    'IMG_3238.jpg',
    'IMG_3237.jpg',
    'IMG_1366.jpg',
    'IMG_3242.JPG',
    'IMG_0960.jpg',
    '20250831145737_002.jpg',
    'IMG_3650.jpg',
    '20250914101539_001.jpg',
    '20250921093719_001.jpg',
  ];
const wall=document.getElementById('wall');
const sentinel=document.getElementById('sentinel');
const viewer=document.getElementById('viewer');
const largeImage=document.getElementById('large-image');
const random=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
function shuffled(){
 const indices=images.map((_,i)=>i);
 for(let i=indices.length-1;i>0;i--){const j=random(0,i);[indices[i],indices[j]]=[indices[j],indices[i]]}
 return indices;
}
let queue=[],lastImage=-1,groups=0,total=0,active=0,previousFocus=null;
function replenish(){
 const fresh=shuffled();
 if(fresh.length>1&&fresh[0]===lastImage){const swap=random(1,fresh.length-1);[fresh[0],fresh[swap]]=[fresh[swap],fresh[0]]}
 queue.push(...fresh);
}
function takeImage(){
 if(!queue.length)replenish();
 const index=queue.shift();lastImage=index;return index;
}
function appendBatch(){
 const fragment=document.createDocumentFragment();
 const count=images.length;
 for(let i=0;i<count;){
  const group=document.createElement('section');group.className='group';
  const remaining=count-i;
  const items=remaining===1?1:(Math.random()<.43?2:1);
  for(let j=0;j<items;j++){
   const index=takeImage();i++;total++;
   const button=document.createElement('button');
   button.type='button';button.className='print';
   const width=items===2?random(23,45):random(28,76);
   button.style.setProperty('--width',width+'%');
   button.style.setProperty('--down',random(0,items===2?125:90)+'px');
   
   if(width<40)button.classList.add('small');
   if(width>65)button.classList.add('large');
   button.setAttribute('aria-label','View photograph');
   const img=document.createElement('img');
   img.src=encodeURI(images[index]);img.alt='';img.loading=total<5?'eager':'lazy';img.decoding='async';
   button.appendChild(img);
   button.addEventListener('click',()=>openImage(index,button));
   group.appendChild(button);
  }
  fragment.appendChild(group);groups++;
 }
 wall.appendChild(fragment);
}
function openImage(index,element){
 active=index;previousFocus=element;largeImage.src=encodeURI(images[active]);
 viewer.classList.add('open');document.body.style.overflow='hidden';viewer.focus();
}
function closeImage(){
 viewer.classList.remove('open');document.body.style.overflow='';
 largeImage.removeAttribute('src');
 if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});
}
function move(delta){active=(active+delta+images.length)%images.length;largeImage.src=encodeURI(images[active])}
document.getElementById('previous').addEventListener('click',e=>{e.stopPropagation();move(-1)});
document.getElementById('next').addEventListener('click',e=>{e.stopPropagation();move(1)});
viewer.addEventListener('click',e=>{if(e.target===viewer||e.target===largeImage)closeImage()});
document.addEventListener('keydown',e=>{
 if(!viewer.classList.contains('open'))return;
 if(e.key==='Escape')closeImage();
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
 if(e.key==='Tab'){e.preventDefault();document.getElementById(e.shiftKey?'previous':'next').focus()}
});
appendBatch();
const observer=new IntersectionObserver(entries=>{
 if(entries[0].isIntersecting&&!viewer.classList.contains('open'))appendBatch();
},{rootMargin:'1400px 0px'});
observer.observe(sentinel);
</script>
</body>
</html>
