<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title></title>
<style>
:root{color-scheme:dark;--ink:#101010;--gap:clamp(4px,.65vw,12px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);min-height:100vh;overflow-x:hidden}
button{font:inherit}
#wallpaper{position:fixed;inset:-5%;z-index:-3;background-repeat:repeat;background-size:170px auto;opacity:.78;filter:contrast(1.32) saturate(1.65);transform:rotate(-3deg) scale(1.15);pointer-events:none;transition:opacity 1.1s,filter 1.1s}
#veil{position:fixed;inset:0;z-index:-2;background:linear-gradient(130deg,rgba(0,0,0,.48),rgba(255,255,255,.08) 50%,rgba(0,0,0,.6));pointer-events:none}
#grain{position:fixed;inset:0;z-index:10;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#canvas{width:100%;max-width:2200px;margin:auto;padding:clamp(9px,1.8vw,30px);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-flow:dense;grid-auto-rows:clamp(28px,4.2vw,72px);gap:var(--gap);min-height:100vh}
.tile{position:relative;grid-column:span var(--w);grid-row:span var(--h);border:0;padding:0;min-width:0;overflow:hidden;cursor:zoom-in;background:rgba(255,255,255,.06);box-shadow:0 7px 38px rgba(0,0,0,.16);transform:rotate(var(--r));isolation:isolate;transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .5s,box-shadow .5s}
.tile img{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--pos);filter:var(--fx);transform:scale(1.01);transition:transform 1s cubic-bezier(.2,.8,.2,1),filter .8s}
.tile:hover,.tile:focus-visible{z-index:5;transform:rotate(0deg) scale(1.035);box-shadow:0 14px 65px rgba(0,0,0,.5);outline:0}
.tile:hover img,.tile:focus-visible img{transform:scale(1.085);filter:none}
.tile:nth-child(9n){border-radius:50%}
.tile:nth-child(13n){clip-path:polygon(0 0,100% 0,100% 80%,0 100%)}
.tile:nth-child(17n){mix-blend-mode:screen}
#viewer{position:fixed;inset:0;z-index:30;background:rgba(8,8,8,.94);display:none;align-items:center;justify-content:center;padding:clamp(12px,4vw,60px);cursor:zoom-out;backdrop-filter:blur(24px)}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:92dvh;object-fit:contain;box-shadow:0 20px 90px rgba(0,0,0,.38)}
#viewer button{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;color:transparent;cursor:pointer}
#viewer button:focus-visible{outline:2px solid white;outline-offset:-8px}
#previous{left:0;cursor:w-resize!important}
#following{right:0;cursor:e-resize!important}
@media(max-width:700px){
 #canvas{grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(25px,8vw,54px);padding:6px;gap:5px}
 .tile{grid-column:span min(var(--w),6);grid-row:span var(--h)}
 #wallpaper{background-size:110px auto}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="wallpaper" aria-hidden="true"></div>
<div id="veil" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<main id="canvas" aria-label="Image collage"></main>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer" tabindex="-1">
<button id="previous" aria-label="Previous image"></button>
<img id="view-image" alt="">
<button id="following" aria-label="Next image"></button>
</div>
<script>
const images = [
    '20241203091002_001_C.jpg',
    '20241203083125_001_C.jpg',
    '20241118144232_001_C.jpg',
    '20241203091812_001_C.jpg',
    '20241203091914_001_C.jpg',
    '20241203091724_001_C.jpg',
    '20241203091219_001_C.jpg',
    '20241203091132_001_C.jpg',
    '20241203091047_001_C.jpg',
    '20241203090918_001-2.jpg',
    '20241203090833_001-2.jpg',
    '20241203090655_001.jpg',
    '20241203090746_001.jpg',
    '20241203083940_001.jpg',
    '20241203084033_001.jpg',
    '20241118143953_001.jpg',
    '20241118144339_001.jpg',
    '20241203085715_001.jpg',
    '20241203085644_001.jpg',
    '20241203083748_001.jpg',
    '20241203083431_001.jpg',
    '20241203083334_001.jpg',
    '20241203083845_001.jpg',
    '20241203085134_001.jpg',
    '20241203090128_001.jpg',
    '000065400006 C.jpg',
    '000065400007 C.jpg',
    '000065400013 C.jpg',
    'IMG_0778.JPG',
    'IMG_3238.jpg',
    'IMG_3237.jpg',
    'IMG_1366.jpg',
    'IMG_3242.JPG',
    'IMG_0960.jpg',
    '20250831145737_002.jpg',
    'IMG_3650.jpg',
    '20250914101539_001.jpg',
    '20250921093719_001.jpg',
  ];
const canvas=document.getElementById('canvas');
const wallpaper=document.getElementById('wallpaper');
const viewer=document.getElementById('viewer');
const viewImage=document.getElementById('view-image');
const random=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=random(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
let order=shuffle([...images.keys()]),active=0,lastFocus=null;
let wallpaperIndex=-1;
function setWallpaper(){
 let next=random(0,images.length-1);
 if(images.length>1&&next===wallpaperIndex)next=(next+1)%images.length;
 wallpaperIndex=next;
 wallpaper.style.opacity='0';
 setTimeout(()=>{
  wallpaper.style.backgroundImage='url("'+encodeURI(images[next]).replace(/"/g,'%22')+'")';
  wallpaper.style.backgroundSize=random(90,270)+'px auto';
  wallpaper.style.filter=['contrast(1.5) saturate(1.8)','grayscale(1) contrast(2)','hue-rotate(140deg) contrast(1.8)','sepia(1) contrast(1.6)'][random(0,3)];
  wallpaper.style.opacity='.78';
 },500);
}
function layout(){
 canvas.replaceChildren();
 const fragment=document.createDocumentFragment();
 order.forEach((index,n)=>{
  const tile=document.createElement('button');
  tile.type='button';tile.className='tile';tile.setAttribute('aria-label','Open image '+(index+1));
  const w=[2,3,3,4,4,5,6,7,8][random(0,8)];
  tile.style.setProperty('--w',w);
  tile.style.setProperty('--h',random(2,6));
  tile.style.setProperty('--r',random(-3,3)+'deg');
  tile.style.setProperty('--pos',random(20,80)+'% '+random(20,80)+'%');
  tile.style.setProperty('--fx',['none','none','grayscale(1) contrast(1.2)','saturate(1.8) contrast(1.2)','sepia(.85) contrast(1.3)'][random(0,4)]);
  const img=document.createElement('img');
  img.src=encodeURI(images[index]);img.alt='';img.loading=n<10?'eager':'lazy';img.decoding='async';
  tile.appendChild(img);
  tile.addEventListener('click',()=>openViewer(index,tile));
  fragment.appendChild(tile);
 });
 canvas.appendChild(fragment);
}
function openViewer(index,el){
 active=index;lastFocus=el;viewImage.src=encodeURI(images[active]);viewer.classList.add('open');viewer.focus();document.body.style.overflow='hidden';
}
function closeViewer(){
 viewer.classList.remove('open');document.body.style.overflow='';viewImage.removeAttribute('src');if(lastFocus?.isConnected)lastFocus.focus();
}
function step(delta){active=(active+delta+images.length)%images.length;viewImage.src=encodeURI(images[active])}
document.getElementById('previous').addEventListener('click',e=>{e.stopPropagation();step(-1)});
document.getElementById('following').addEventListener('click',e=>{e.stopPropagation();step(1)});
viewer.addEventListener('click',e=>{if(e.target===viewer||e.target===viewImage)closeViewer()});
document.addEventListener('keydown',e=>{
 if(viewer.classList.contains('open')){
  if(e.key==='Escape')closeViewer();
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='ArrowRight')step(1);
  if(e.key==='Tab'){e.preventDefault();document.getElementById(e.shiftKey?'previous':'following').focus()}
 }else if(e.key.toLowerCase()==='r'){order=shuffle(order);layout();setWallpaper()}
});
let lastShift=0;
window.addEventListener('scroll',()=>{
 if(viewer.classList.contains('open'))return;
 if(window.scrollY-lastShift>window.innerHeight*1.6){lastShift=window.scrollY;setWallpaper()}
},{passive:true});
window.addEventListener('click',e=>{
 if(e.target===canvas||e.target===document.body){order=shuffle(order);layout();setWallpaper()}
});
layout();setWallpaper();
</script>
</body>
</html>
