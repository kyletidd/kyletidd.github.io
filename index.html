<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title></title>
<style>
*{box-sizing:border-box}
html{background:#fff;scroll-behavior:smooth}
body{margin:0;background:#fff;color:#111}
button{font:inherit}
#wall{max-width:1580px;margin:0 auto;padding:clamp(62px,10vw,172px) clamp(22px,7vw,120px) 24vh}
.group{display:flex;align-items:flex-start;justify-content:space-between;gap:clamp(24px,7vw,140px);margin-bottom:clamp(115px,16vw,310px);min-height:160px}
.group:nth-child(3n+2){padding-left:clamp(0px,8vw,150px)}
.group:nth-child(4n+3){padding-right:clamp(0px,9vw,160px)}
.group:nth-child(5n){justify-content:center}
.print{appearance:none;display:block;position:relative;flex:0 1 var(--width);max-width:var(--width);margin-top:var(--down);padding:0;border:0;background:transparent;cursor:zoom-in;transform:rotate(var(--tilt));transition:transform .28s ease}
.print img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;box-shadow:0 3px 9px rgba(0,0,0,.055);background:#f6f6f6}
.print:after{content:'';position:absolute;top:-5px;left:50%;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fafafa 0 19%,#929292 44%,#555 70%,#aaa 100%);box-shadow:1px 2px 3px #0002;opacity:.55;pointer-events:none}
.print:nth-child(2):after{top:-3px;left:48%;width:7px;height:7px}
.print:hover,.print:focus-visible{transform:rotate(0deg) translateY(-3px);outline:none;z-index:2}
.print:focus-visible img{outline:2px solid #333;outline-offset:6px}
.print.small{flex-basis:var(--width);align-self:flex-end}
.print.small img{max-height:38vh}
.print.large img{max-height:85vh}
#viewer{position:fixed;inset:0;display:none;background:rgba(255,255,255,.97);z-index:20;align-items:center;justify-content:center;padding:6vw;cursor:zoom-out}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:88dvh;object-fit:contain}
#viewer button{position:absolute;top:0;bottom:0;width:18%;background:transparent;border:0;cursor:pointer}
#previous{left:0;cursor:w-resize!important}
#next{right:0;cursor:e-resize!important}
#viewer button:focus-visible{outline:2px solid #111;outline-offset:-8px}
@media(max-width:700px){
 #wall{padding:75px 18px 100px}
 .group{gap:22px;margin-bottom:115px;min-height:0}
 .group:nth-child(n){padding-left:0;padding-right:0}
 .group:nth-child(4n+2){padding-left:12vw}
 .group:nth-child(5n+3){padding-right:9vw}
 .print{margin-top:calc(var(--down) * .35);flex-basis:var(--width);max-width:var(--width)}
 .print img{max-height:64vh}
 .print.small img{max-height:32vh}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.print{transition:none}}
</style>
</head>
<body>
<main id="wall" aria-label="Photographs and working images"></main>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer" tabindex="-1">
<button id="previous" aria-label="Previous image"></button>
<img id="large-image" alt="">
<button id="next" aria-label="Next image"></button>
</div>
<script>
const images = [
    '20241203091002_001_C.jpg',
    '20241203083125_001_C.jpg',
    '20241118144232_001_C.jpg',
    '20241203091812_001_C.jpg',
    '20241203091914_001_C.jpg',
    '20241203091724_001_C.jpg',
    '20241203091219_001_C.jpg',
    '20241203091132_001_C.jpg',
    '20241203091047_001_C.jpg',
    '20241203090918_001-2.jpg',
    '20241203090833_001-2.jpg',
    '20241203090655_001.jpg',
    '20241203090746_001.jpg',
    '20241203083940_001.jpg',
    '20241203084033_001.jpg',
    '20241118143953_001.jpg',
    '20241118144339_001.jpg',
    '20241203085715_001.jpg',
    '20241203085644_001.jpg',
    '20241203083748_001.jpg',
    '20241203083431_001.jpg',
    '20241203083334_001.jpg',
    '20241203083845_001.jpg',
    '20241203085134_001.jpg',
    '20241203090128_001.jpg',
    '000065400006 C.jpg',
    '000065400007 C.jpg',
    '000065400013 C.jpg',
    'IMG_0778.JPG',
    'IMG_3238.jpg',
    'IMG_3237.jpg',
    'IMG_1366.jpg',
    'IMG_3242.JPG',
    'IMG_0960.jpg',
    '20250831145737_002.jpg',
    'IMG_3650.jpg',
    '20250914101539_001.jpg',
    '20250921093719_001.jpg',
  ];
const wall=document.getElementById('wall');
const viewer=document.getElementById('viewer');
const largeImage=document.getElementById('large-image');
let active=0,previousFocus=null;
const patterns=[
 [{w:64,down:0,size:'large'}],
 [{w:37,down:80,size:'small'},{w:44,down:0,size:''}],
 [{w:53,down:0,size:''}],
 [{w:30,down:145,size:'small'},{w:52,down:0,size:'large'}],
 [{w:45,down:0,size:''}],
 [{w:55,down:0,size:'large'},{w:24,down:165,size:'small'}],
 [{w:37,down:0,size:'small'}],
 [{w:43,down:95,size:''},{w:38,down:0,size:'small'}],
 [{w:72,down:0,size:'large'}]
];
let index=0,section=0;
while(index<images.length){
 const group=document.createElement('section');
 group.className='group';
 const scheme=patterns[section%patterns.length];
 for(const p of scheme){
  if(index>=images.length)break;
  const pos=index++;
  const button=document.createElement('button');
  button.type='button';
  button.className='print '+p.size;
  button.style.setProperty('--width',p.w+'%');
  button.style.setProperty('--down',p.down+'px');
  button.style.setProperty('--tilt',(((section*7+pos*3)%9)-4)*.13+'deg');
  button.setAttribute('aria-label','View photograph '+(pos+1));
  const img=document.createElement('img');
  img.src=encodeURI(images[pos]);
  img.alt='';
  img.loading=pos<4?'eager':'lazy';
  img.decoding='async';
  button.appendChild(img);
  button.addEventListener('click',()=>openImage(pos,button));
  group.appendChild(button);
 }
 wall.appendChild(group);section++;
}
function openImage(pos,el){
 active=pos;previousFocus=el;largeImage.src=encodeURI(images[active]);
 viewer.classList.add('open');document.body.style.overflow='hidden';viewer.focus();
}
function closeImage(){
 viewer.classList.remove('open');document.body.style.overflow='';
 largeImage.removeAttribute('src');previousFocus?.focus();
}
function move(delta){active=(active+delta+images.length)%images.length;largeImage.src=encodeURI(images[active])}
document.getElementById('previous').addEventListener('click',e=>{e.stopPropagation();move(-1)});
document.getElementById('next').addEventListener('click',e=>{e.stopPropagation();move(1)});
viewer.addEventListener('click',e=>{if(e.target===viewer||e.target===largeImage)closeImage()});
document.addEventListener('keydown',e=>{
 if(!viewer.classList.contains('open'))return;
 if(e.key==='Escape')closeImage();
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
 if(e.key==='Tab'){e.preventDefault();document.getElementById(e.shiftKey?'previous':'next').focus()}
});
</script>
</body>
</html>
