<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161b1c">
  <meta name="description" content="A one-pixel-at-a-time colour field. KT STUDIO — experiment 001.">
  <title>Singular Field — KT STUDIO / 001</title>
  <style>
    :root { color-scheme: dark; --paper:#e5e4da; --ink:#14191a; --edge:rgba(230,230,216,.3); }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--ink); }
    body { color:var(--paper); font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
    #field { position:fixed; inset:0; display:block; width:100%; height:100%; image-rendering:pixelated; cursor:crosshair; touch-action:pan-y; }
    .frame { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(21px,3vw,44px); }
    .mast, .foot { display:flex; justify-content:space-between; align-items:flex-start; gap:24px; }
    .micro { font-size:10px; font-weight:700; line-height:1.55; letter-spacing:.16em; text-transform:uppercase; text-shadow:0 1px 6px #1119; }
    .micro.right { text-align:right; }
    h1 { margin:0; width:min(850px,85vw); font-size:clamp(58px,11vw,178px); letter-spacing:-.092em; line-height:.79; font-weight:600; text-transform:uppercase; color:var(--paper); text-shadow:0 2px 24px #0004; }
    .identity { margin-top:auto; margin-bottom:clamp(40px,9vh,124px); }
    .identity p { margin:20px 0 0 6px; max-width:410px; font-size:clamp(11px,1vw,14px); line-height:1.5; letter-spacing:.08em; text-transform:uppercase; }
    .foot { align-items:flex-end; }
    .interface { position:fixed; right:clamp(21px,3vw,44px); bottom:clamp(65px,6vw,90px); display:flex; gap:5px; align-items:center; z-index:5; }
    .interface button { color:var(--paper); background:rgba(20,25,26,.87); border:1px solid var(--edge); border-radius:0; font:700 10px Arial,Helvetica,sans-serif; letter-spacing:.09em; padding:13px 15px; text-transform:uppercase; cursor:pointer; min-height:43px; }
    .interface button:hover, .interface button:focus-visible { background:var(--paper); color:var(--ink); outline:none; }
    #loupe { position:fixed; display:none; z-index:4; width:176px; height:176px; pointer-events:none; border:1px solid var(--paper); box-shadow:0 8px 36px #0008; image-rendering:pixelated; background:var(--ink); }
    #loupe.on { display:block; }
    .readout { position:fixed; left:clamp(21px,3vw,44px); bottom:clamp(76px,7vw,112px); font:700 10px/1.6 Arial,sans-serif; letter-spacing:.12em; text-transform:uppercase; text-shadow:0 1px 6px #1119; }
    @media (max-width:650px) {
      h1 { font-size:clamp(56px,15vw,105px); width:95%; }
      .identity { margin-bottom:20vh; }
      .identity p { font-size:10px; max-width:260px; }
      .interface { left:21px; right:21px; bottom:72px; }
      .interface button { flex:1; padding:12px 5px; font-size:9px; }
      .readout { bottom:130px; }
      .micro { font-size:9px; }
    }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <canvas id="field" role="img" aria-label="An alternating matrix of uniquely varied one-pixel colour samples in a restrained KT palette"></canvas>
  <canvas id="loupe" width="176" height="176" aria-hidden="true"></canvas>
  <div class="frame">
    <header class="mast">
      <div class="micro">KT STUDIO<br>FIELD STUDIES</div>
      <div class="micro right">EXPERIMENT 001<br>10.11.2026</div>
    </header>
    <main class="identity">
      <h1>SINGULAR<br>FIELD</h1>
      <p>Alternation without repetition.<br>One pixel at a time.</p>
    </main>
    <footer class="foot">
      <div class="micro">GENERATIVE COLOUR / DIGITAL MATERIAL</div>
      <div class="micro right">1 : 1 / PIXEL STUDY</div>
    </footer>
  </div>
  <div class="readout" id="readout" aria-live="polite">KT / MINERAL — 1 PX</div>
  <nav class="interface" aria-label="Colour field controls">
    <button type="button" id="palette">CHANGE PALETTE</button>
    <button type="button" id="seed">RECOMPOSE</button>
    <button type="button" id="inspect" aria-pressed="false">INSPECT: OFF</button>
  </nav>
  <script>
  (() => {
    'use strict';
    const field = document.getElementById('field');
    const ctx = field.getContext('2d', {alpha:false});
    const loupe = document.getElementById('loupe');
    const lc = loupe.getContext('2d', {alpha:false});
    const readout = document.getElementById('readout');
    const palettes = [
      { name:'KT / MINERAL', colors:[[20,24,25],[205,205,193],[47,73,64],[92,111,135]] },
      { name:'KT / NOCTURNE', colors:[[9,13,19],[147,153,156],[29,54,63],[96,113,119]] },
      { name:'KT / EARTH', colors:[[34,34,30],[222,215,197],[79,101,76],[110,126,145]] }
    ];
    let paletteIndex = 0, seed = 17, inspect = false, raf = 0;
    let pixelRatio = 1;

    function mix32(x) {
      x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
      x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
      return (x ^ (x >>> 16)) >>> 0;
    }
    function draw() {
      const bounds = field.getBoundingClientRect();
      pixelRatio = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.round(bounds.width * pixelRatio));
      const h = Math.max(1, Math.round(bounds.height * pixelRatio));
      field.width = w; field.height = h;
      const img = ctx.createImageData(w,h);
      const data = img.data;
      const colors = palettes[paletteIndex].colors;
      const phase = seed * 0.733;
      for (let y=0; y<h; y++) {
        const vy=y/h;
        for (let x=0; x<w; x++) {
          const vx=x/w;
          const wave = Math.sin(vx*8.2+phase)*0.52 +
                       Math.cos(vy*10.1-phase*.7)*0.38 +
                       Math.sin((vx-vy)*13.9+phase*.41)*0.27;
          const bank = wave > 0.11 ? 2 : 0;
          const swatch = colors[bank+((x+y)&1)];
          const hsh = mix32((x+1) ^ Math.imul(y+1, 374761393) ^ Math.imul(seed, 668265263));
          const delta = (hsh % 23)-11;
          const second = ((hsh >>> 8)%13)-6;
          const third = ((hsh >>> 16)%15)-7;
          const i=(y*w+x)*4;
          data[i]=Math.max(0,Math.min(255,swatch[0]+delta));
          data[i+1]=Math.max(0,Math.min(255,swatch[1]+second));
          data[i+2]=Math.max(0,Math.min(255,swatch[2]+third));
          data[i+3]=255;
        }
      }
      ctx.putImageData(img,0,0);
      readout.textContent = palettes[paletteIndex].name + ' — ' + w.toLocaleString() + ' × ' + h.toLocaleString() + ' PX';
    }
    function scheduleDraw() { cancelAnimationFrame(raf); raf=requestAnimationFrame(draw); }
    function updateLoupe(event) {
      if(!inspect) return;
      const xx=event.clientX, yy=event.clientY;
      const x=Math.round(xx*pixelRatio), y=Math.round(yy*pixelRatio);
      lc.imageSmoothingEnabled=false;
      lc.clearRect(0,0,176,176);
      lc.drawImage(field,Math.max(0,x-11),Math.max(0,y-11),22,22,0,0,176,176);
      loupe.style.left=Math.min(window.innerWidth-188,Math.max(12,xx+24))+'px';
      loupe.style.top=Math.min(window.innerHeight-188,Math.max(12,yy-188))+'px';
      loupe.classList.add('on');
    }
    document.getElementById('palette').addEventListener('click',()=>{
      paletteIndex=(paletteIndex+1)%palettes.length; scheduleDraw();
    });
    document.getElementById('seed').addEventListener('click',()=>{
      seed++; scheduleDraw();
    });
    document.getElementById('inspect').addEventListener('click',event=>{
      inspect=!inspect; event.currentTarget.textContent='INSPECT: '+(inspect?'ON':'OFF');
      event.currentTarget.setAttribute('aria-pressed',String(inspect));
      if(!inspect)loupe.classList.remove('on');
    });
    field.addEventListener('pointermove',updateLoupe,{passive:true});
    field.addEventListener('pointerleave',()=>loupe.classList.remove('on'));
    window.addEventListener('resize',scheduleDraw,{passive:true});
    scheduleDraw();
  })();
  </script>
</body>
</html>
